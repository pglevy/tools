<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR codes from any text or URL. Choose error correction, colors, and export size, then copy or download a crisp high-resolution PNG or SVG.">
    <title>QR Code Generator</title>
    <style>
        :root {
            --paper: #f4f1ea;
            --paper-deep: #eae5da;
            --ink: #16130e;
            --ink-soft: #5c564a;
            --line: #d5cfc1;
            --scan: #f23a00;
            --scan-deep: #c93000;
            --ok: #1a7f37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--paper);
            background-image: radial-gradient(var(--line) 1px, transparent 1px);
            background-size: 22px 22px;
            color: var(--ink);
            min-height: 100vh;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }

        /* ---------- Header ---------- */
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            border-bottom: 3px solid var(--ink);
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Doto', monospace;
            font-weight: 900;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            letter-spacing: 0.02em;
            line-height: 1;
        }

        h1 .accent { color: var(--scan); }

        .tagline {
            font-size: 0.85rem;
            color: var(--ink-soft);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ---------- Layout ---------- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 760px) {
            .grid { grid-template-columns: 1fr; }
        }

        /* ---------- Controls ---------- */
        .field { margin-bottom: 1.6rem; }

        label, .field-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            min-height: 7.5rem;
            padding: 0.9rem 1rem;
            font: 500 1rem/1.5 'Archivo', sans-serif;
            color: var(--ink);
            background: #fffdf8;
            border: 2px solid var(--ink);
            border-radius: 0;
            box-shadow: 4px 4px 0 var(--paper-deep);
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            box-shadow: 4px 4px 0 var(--scan);
        }

        .char-count {
            margin-top: 0.4rem;
            font-size: 0.78rem;
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        /* Segmented control */
        .segmented {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 2px solid var(--ink);
            background: #fffdf8;
            box-shadow: 4px 4px 0 var(--paper-deep);
        }

        .segmented button {
            appearance: none;
            border: none;
            background: transparent;
            padding: 0.55rem 0.25rem 0.5rem;
            font-family: 'Archivo', sans-serif;
            cursor: pointer;
            color: var(--ink-soft);
            border-right: 2px solid var(--ink);
            transition: background 0.12s ease;
        }

        .segmented button:last-child { border-right: none; }
        .segmented button:hover { background: var(--paper-deep); }

        .segmented button.active {
            background: var(--ink);
            color: var(--paper);
        }

        .segmented .ecc-letter {
            display: block;
            font-weight: 800;
            font-size: 1rem;
        }

        .segmented .ecc-pct {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 0.03em;
        }

        .segmented button.active .ecc-pct { color: #f8b6a0; }

        .hint {
            margin-top: 0.4rem;
            font-size: 0.78rem;
            color: var(--ink-soft);
        }

        /* Color + size row */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .swatch-pair { display: flex; gap: 0.75rem; }

        .swatch {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--ink);
            background: #fffdf8;
            box-shadow: 4px 4px 0 var(--paper-deep);
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .swatch input[type="color"] {
            width: 1.6rem;
            height: 1.6rem;
            border: 1px solid var(--ink);
            padding: 0;
            background: none;
            cursor: pointer;
        }

        select {
            width: 100%;
            /* match the .swatch height: 2px borders + 0.4rem padding + 1.6rem color input */
            height: calc(2.4rem + 4px);
            padding: 0 0.6rem;
            font: 600 0.9rem 'Archivo', sans-serif;
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 0;
            background: #fffdf8;
            box-shadow: 4px 4px 0 var(--paper-deep);
            cursor: pointer;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--ink);
            text-transform: none;
            letter-spacing: normal;
            cursor: pointer;
        }

        .checkbox input {
            width: 1.05rem;
            height: 1.05rem;
            accent-color: var(--scan);
        }

        .warning {
            display: none;
            margin-top: 1rem;
            padding: 0.7rem 0.9rem;
            border: 2px solid var(--scan);
            background: #ffe9e0;
            color: var(--scan-deep);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .warning.show { display: block; }

        /* ---------- Preview ---------- */
        .preview-wrap { position: sticky; top: 2rem; }

        .preview-card {
            position: relative;
            border: 3px solid var(--ink);
            background: #fffdf8;
            padding: 1.75rem;
            box-shadow: 8px 8px 0 var(--paper-deep);
        }

        /* Finder-pattern corner marks */
        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 3px solid var(--scan);
        }

        .corner::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--scan);
        }

        .corner.tl { top: 6px; left: 6px; }
        .corner.tr { top: 6px; right: 6px; }
        .corner.bl { bottom: 6px; left: 6px; }

        #qr-canvas[hidden] { display: none; }

        #qr-canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .preview-empty {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--ink-soft);
            font-family: 'Doto', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1rem;
        }

        .meta {
            margin-top: 1rem;
            font-size: 0.78rem;
            color: var(--ink-soft);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            text-align: center;
            min-height: 1.1em;
        }

        /* ---------- Buttons ---------- */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .btn {
            appearance: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1rem;
            font: 700 0.9rem 'Archivo', sans-serif;
            letter-spacing: 0.03em;
            border: 2px solid var(--ink);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        .btn svg { width: 1rem; height: 1rem; }

        .btn-primary { background: var(--scan); color: #fff; grid-column: 1 / -1; }
        .btn-primary:hover { background: var(--scan-deep); }

        .btn-secondary { background: #fffdf8; color: var(--ink); }
        .btn-secondary:hover { background: var(--paper-deep); }

        .btn.done { background: var(--ok); border-color: var(--ok); color: #fff; }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 4px 4px 0 var(--ink);
        }

        footer {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: var(--ink-soft);
            text-align: center;
        }

        footer a { color: var(--scan-deep); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <header>
            <h1>QR<span class="accent">▪</span>CODE GENERATOR</h1>
            <p class="tagline">Text in → pixels out. Nothing leaves your browser.</p>
        </header>

        <div class="grid">
            <section aria-label="Settings">
                <div class="field">
                    <label for="qr-input">Content</label>
                    <textarea id="qr-input" placeholder="https://example.com — or any text, Wi-Fi config, vCard…" autofocus></textarea>
                    <div class="char-count" id="char-count">0 characters</div>
                </div>

                <div class="field">
                    <span class="field-label">Error correction</span>
                    <div class="segmented" id="ecc-control" role="radiogroup" aria-label="Error correction level">
                        <button type="button" data-ecc="L"><span class="ecc-letter">L</span><span class="ecc-pct">7%</span></button>
                        <button type="button" data-ecc="M" class="active"><span class="ecc-letter">M</span><span class="ecc-pct">15%</span></button>
                        <button type="button" data-ecc="Q"><span class="ecc-letter">Q</span><span class="ecc-pct">25%</span></button>
                        <button type="button" data-ecc="H"><span class="ecc-letter">H</span><span class="ecc-pct">30%</span></button>
                    </div>
                    <p class="hint">Higher levels survive more smudging and let you overlay a logo, but make denser codes.</p>
                </div>

                <div class="field row">
                    <div>
                        <span class="field-label">Colors</span>
                        <div class="swatch-pair">
                            <label class="swatch" for="fg-color"><input type="color" id="fg-color" value="#16130e">Ink</label>
                            <label class="swatch" for="bg-color"><input type="color" id="bg-color" value="#ffffff">Paper</label>
                        </div>
                    </div>
                    <div>
                        <label for="export-size">Export size</label>
                        <select id="export-size">
                            <option value="512">512 × 512 px</option>
                            <option value="1024" selected>1024 × 1024 px</option>
                            <option value="2048">2048 × 2048 px</option>
                            <option value="4096">4096 × 4096 px</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="checkbox">
                        <input type="checkbox" id="quiet-zone" checked>
                        Include quiet zone (recommended for reliable scanning)
                    </label>
                </div>

                <div class="warning" id="warning" role="alert"></div>
            </section>

            <section class="preview-wrap" aria-label="Preview and export">
                <div class="preview-card">
                    <div class="corner tl"></div>
                    <div class="corner tr"></div>
                    <div class="corner bl"></div>
                    <canvas id="qr-canvas" hidden></canvas>
                    <div class="preview-empty" id="preview-empty">TYPE SOMETHING TO GENERATE</div>
                </div>
                <div class="meta" id="meta"></div>
                <div class="actions">
                    <button type="button" class="btn btn-primary" id="copy-btn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Copy PNG
                    </button>
                    <button type="button" class="btn btn-secondary" id="download-png-btn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        PNG
                    </button>
                    <button type="button" class="btn btn-secondary" id="download-svg-btn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        SVG
                    </button>
                </div>
            </section>
        </div>

        <footer>
            Generated locally with <a href="https://github.com/kazuhikoarase/qrcode-generator" rel="noopener">qrcode-generator</a> (MIT).
            Part of <a href="https://pglevy.github.io/web-tools/">web-tools</a>.
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

        const QUIET_MODULES = 4;

        const input = document.getElementById('qr-input');
        const charCount = document.getElementById('char-count');
        const eccControl = document.getElementById('ecc-control');
        const fgColor = document.getElementById('fg-color');
        const bgColor = document.getElementById('bg-color');
        const exportSize = document.getElementById('export-size');
        const quietZone = document.getElementById('quiet-zone');
        const warning = document.getElementById('warning');
        const canvas = document.getElementById('qr-canvas');
        const previewEmpty = document.getElementById('preview-empty');
        const meta = document.getElementById('meta');
        const copyBtn = document.getElementById('copy-btn');
        const downloadPngBtn = document.getElementById('download-png-btn');
        const downloadSvgBtn = document.getElementById('download-svg-btn');

        let ecc = 'M';
        let qr = null;

        function showWarning(msg) {
            warning.textContent = msg;
            warning.classList.toggle('show', !!msg);
        }

        function relativeLuminance(hex) {
            const c = [1, 3, 5].map(i => {
                let v = parseInt(hex.slice(i, i + 2), 16) / 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
        }

        function contrastRatio(hexA, hexB) {
            const [hi, lo] = [relativeLuminance(hexA), relativeLuminance(hexB)].sort((a, b) => b - a);
            return (hi + 0.05) / (lo + 0.05);
        }

        // Draw the QR at 1px per module, then scale up with smoothing off for crisp edges.
        function drawTo(targetCanvas, sizePx) {
            const count = qr.getModuleCount();
            const quiet = quietZone.checked ? QUIET_MODULES : 0;
            const total = count + quiet * 2;

            const small = document.createElement('canvas');
            small.width = small.height = total;
            const sctx = small.getContext('2d');
            sctx.fillStyle = bgColor.value;
            sctx.fillRect(0, 0, total, total);
            sctx.fillStyle = fgColor.value;
            for (let r = 0; r < count; r++) {
                for (let c = 0; c < count; c++) {
                    if (qr.isDark(r, c)) sctx.fillRect(c + quiet, r + quiet, 1, 1);
                }
            }

            targetCanvas.width = targetCanvas.height = sizePx;
            const ctx = targetCanvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(small, 0, 0, sizePx, sizePx);
        }

        function generate() {
            const text = input.value;
            charCount.textContent = `${text.length} character${text.length === 1 ? '' : 's'}`;

            if (!text) {
                qr = null;
                canvas.hidden = true;
                previewEmpty.style.display = 'flex';
                meta.textContent = '';
                showWarning('');
                [copyBtn, downloadPngBtn, downloadSvgBtn].forEach(b => b.disabled = true);
                return;
            }

            try {
                qr = qrcode(0, ecc); // 0 = pick smallest version that fits
                qr.addData(text);
                qr.make();
            } catch (e) {
                qr = null;
                canvas.hidden = true;
                previewEmpty.style.display = 'flex';
                meta.textContent = '';
                showWarning(`Too much data for a QR code at level ${ecc}. Shorten the content or lower the error correction.`);
                [copyBtn, downloadPngBtn, downloadSvgBtn].forEach(b => b.disabled = true);
                return;
            }

            const count = qr.getModuleCount();
            const version = (count - 17) / 4;
            drawTo(canvas, count * 12);
            canvas.hidden = false;
            previewEmpty.style.display = 'none';
            meta.textContent = `Version ${version} · ${count}×${count} modules · Level ${ecc}`;
            [copyBtn, downloadPngBtn, downloadSvgBtn].forEach(b => b.disabled = false);

            showWarning(contrastRatio(fgColor.value, bgColor.value) < 2.5
                ? 'Low contrast between ink and paper — many scanners will struggle with this combination.'
                : '');
        }

        function exportCanvasBlob() {
            const out = document.createElement('canvas');
            drawTo(out, parseInt(exportSize.value, 10));
            return new Promise(resolve => out.toBlob(resolve, 'image/png'));
        }

        function flashDone(btn, label) {
            const original = btn.innerHTML;
            btn.classList.add('done');
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ${label}`;
            setTimeout(() => {
                btn.classList.remove('done');
                btn.innerHTML = original;
            }, 1500);
        }

        copyBtn.addEventListener('click', async () => {
            if (!qr) return;
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': exportCanvasBlob() })
                ]);
                flashDone(copyBtn, 'Copied');
            } catch (e) {
                showWarning('Copying images is not supported in this browser — use the PNG download instead.');
            }
        });

        downloadPngBtn.addEventListener('click', async () => {
            if (!qr) return;
            const blob = await exportCanvasBlob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `qr-code-${exportSize.value}.png`;
            a.click();
            URL.revokeObjectURL(url);
            flashDone(downloadPngBtn, 'Saved');
        });

        downloadSvgBtn.addEventListener('click', () => {
            if (!qr) return;
            const count = qr.getModuleCount();
            const quiet = quietZone.checked ? QUIET_MODULES : 0;
            const total = count + quiet * 2;
            let path = '';
            for (let r = 0; r < count; r++) {
                for (let c = 0; c < count; c++) {
                    if (qr.isDark(r, c)) path += `M${c + quiet} ${r + quiet}h1v1h-1z`;
                }
            }
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="${bgColor.value}"/><path d="${path}" fill="${fgColor.value}"/></svg>`;
            const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = 'qr-code.svg';
            a.click();
            URL.revokeObjectURL(url);
            flashDone(downloadSvgBtn, 'Saved');
        });

        eccControl.addEventListener('click', e => {
            const btn = e.target.closest('button[data-ecc]');
            if (!btn) return;
            ecc = btn.dataset.ecc;
            eccControl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            generate();
        });

        let debounce;
        input.addEventListener('input', () => {
            clearTimeout(debounce);
            debounce = setTimeout(generate, 150);
        });

        [fgColor, bgColor, quietZone].forEach(el => el.addEventListener('input', generate));

        generate();
    </script>
</body>
</html>
